apiVersion: apps/v1
kind: Deployment
metadata:
  name: macula-gateway
  namespace: macula-system
  labels:
    app: macula-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: macula-gateway
  template:
    metadata:
      labels:
        app: macula-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: gateway
        image: macula/macula-gateway:latest
        imagePullPolicy: Never
        ports:
        - name: quic
          containerPort: 9443
          protocol: UDP
        - name: health
          containerPort: 8080
          protocol: TCP
        env:
        - name: GATEWAY_PORT
          value: "9443"
        - name: GATEWAY_REALM
          value: "be.cortexiq.energy"
        - name: HEALTH_PORT
          value: "8080"
        - name: RELEASE_COOKIE
          value: "macula-gateway-cookie"
        - name: RELEASE_NODE
          value: "gateway@127.0.0.1"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
